[project]
name = "secondbrain"
version = "0.1.0"
description = "Local-first cross-project work memory for coding agents"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
secondbrain = "secondbrain.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
